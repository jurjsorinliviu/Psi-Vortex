[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-vortex-reproducible"
version = "2.0.4"
description = "Complete chronological Ψ-Vortex experiment and deployment reproducibility suite"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "jinja2>=3.1",
]

[project.scripts]
psi-vortex = "psi_vortex.cli:main"

[tool.setuptools.packages.find]
include = ["psi_vortex*", "experiments*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
