name: reproducibility-core

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e .
      - run: python -m compileall -q psi_vortex experiments
      - run: python -m psi_vortex verify
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_public_record.py
      - run: python -m psi_vortex run --config configs/smoke.json --groups dataset_integrity,export_validation,scalable_bic --output results/ci --fail-fast
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
